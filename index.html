<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#130b27">
  <meta name="description" content="ZEN ZONE — mis redes en un solo lugar.">
  <title>ZEN ZONE ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="page">
    <div class="topline">
      <span class="hearts" aria-label="tres corazones">♥ ♥ ♥</span>
      <span class="game-on">GAME ON ♡</span>
      <span class="window-icons" aria-hidden="true">□　×</span>
    </div>

    <header class="hero">
      <div class="avatar-frame">
        <span class="crown" aria-hidden="true">♛</span>
        <img src="assets/avatar.png" class="avatar" alt="Avatar VTuber de ZEN: gatito blanco con gafas oscuras">
        <span class="speech" aria-hidden="true">♥</span>
      </div>
      <h1>ZEN ZONE</h1>
      <p class="welcome">— Welcome to my zone ♡ —</p>
      <div class="controller-divider" aria-hidden="true"><span></span> 🎮 <span></span></div>
    </header>

    <section class="socials" aria-labelledby="social-title">
      <h2 id="social-title"><span>★</span> MY SOCIALS <span>★</span></h2>
      <div class="links">
        <a class="social discord" href="https://discord.gg/BqXZexyxBb" target="_blank" rel="noopener noreferrer">
          <span class="social-icon" aria-hidden="true">◉</span>
          <span class="social-copy"><strong>Discord</strong><small>Únete a la comunidad</small></span>
          <span class="arrow">▶</span>
        </a>
        <a class="social tiktok" href="https://www.tiktok.com/@sensei_zenn" target="_blank" rel="noopener noreferrer">
          <span class="social-icon" aria-hidden="true">♪</span>
          <span class="social-copy"><strong>TikTok</strong><small>Sígueme en TikTok</small></span>
          <span class="arrow">▶</span>
        </a>
        <a class="social instagram" data-link="instagram" href="#" aria-label="Instagram, enlace pendiente">
          <span class="social-icon" aria-hidden="true">◎</span>
          <span class="social-copy"><strong>Instagram</strong><small>Sígueme en Instagram</small></span>
          <span class="arrow">▶</span>
        </a>
        <a class="social whatsapp" data-link="whatsapp" href="#" aria-label="Canal de WhatsApp, enlace pendiente">
          <span class="social-icon" aria-hidden="true">◔</span>
          <span class="social-copy"><strong>WhatsApp</strong><small>Canal de WhatsApp</small></span>
          <span class="arrow">▶</span>
        </a>
        <a class="social youtube" data-link="youtube" href="#" aria-label="YouTube, enlace pendiente">
          <span class="social-icon" aria-hidden="true">▶</span>
          <span class="social-copy"><strong>YouTube</strong><small>Suscríbete</small></span>
          <span class="arrow">▶</span>
        </a>
      </div>
      <p class="hint" id="hint" role="status" aria-live="polite"></p>
    </section>

    <div class="side-note note-left" aria-hidden="true">GOOD<br>VIBES ♡<br>✧</div>
    <div class="side-note note-right" aria-hidden="true">LET'S<br>PLAY! ♡<br>↙</div>
    <div class="decor cat-sleep" aria-hidden="true">🐾</div>
    <div class="decor pixel-heart" aria-hidden="true">♥</div>
    <footer><span>♥ ♥</span> Thanks for visiting! ♡ <span>♥ ♥</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
